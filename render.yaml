# Render Blueprint for the Aexto API (backend folder).
# New > Blueprint > pick this repo. Render reads this file and creates the service.
# Data lives in MongoDB, so redeploys and restarts never erase products, settings, enquiries or pictures.
services:
  - type: web
    name: aexto-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aexto.com
      # Used once, to create the admin login the first time the database is empty. Change it in Admin > Account.
      - key: ADMIN_PASSWORD
        sync: false
      # The cluster's connection string. Never put it in this file or in git: set it in the Render dashboard.
      - key: MONGODB_URI
        sync: false
      # This project's own database on the cluster.
      - key: MONGODB_DB
        value: aexto_website
      - key: CLIENT_ORIGIN
        value: https://haionbattery.vercel.app
